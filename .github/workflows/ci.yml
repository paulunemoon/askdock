name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: package.json's "packageManager" field pins it.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: packages resolve each other through dist/, and a fresh
      # clone has none. Typecheck and tests both read what this produces.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # The demo is the integration check — a real Next build against the
      # published entry points. It needs no key: nothing calls a model here.
      - run: pnpm --filter askdock-demo build
